# 放到 /etc/nginx/sites-available/poetry
# Let's Encrypt 版: poetry.70kj.vip (API) + admin.poetry.70kj.vip (管理后台)
# 部署时替换域名，再: sudo nginx -t && sudo systemctl reload nginx
# 签证书前: CF 记录改灰云; 签完改回橙云

# ── poetry.70kj.vip (古诗词 API) ──
server {
    listen 80;
    listen [::]:80;
    server_name poetry.70kj.vip;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name poetry.70kj.vip;

    ssl_certificate     /etc/letsencrypt/live/poetry.70kj.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poetry.70kj.vip/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:1279;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/poetry.access.log;
}

# ── admin.poetry.70kj.vip (管理后台) ──
server {
    listen 80;
    listen [::]:80;
    server_name admin.poetry.70kj.vip;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.poetry.70kj.vip;

    ssl_certificate     /etc/letsencrypt/live/admin.poetry.70kj.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.poetry.70kj.vip/privkey.pem;

    # 反代到 admin 容器（本机 3000）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/poetry-admin.access.log;
}
