# 放到 /etc/nginx/sites-available/poetry
# Let's Encrypt 版(这次实际跑通的): 443 指到 /etc/letsencrypt/live/<域>/,
# 证书用 certbot 签。
# 部署时把 poetry.70kj.vip 全局替换成你的真实域, 再:
#   sudo nginx -t && sudo systemctl reload nginx

server {
    # HTTP: 强制跳 HTTPS; LE webroot 验证要放行 acme-challenge
    listen 80;
    listen [::]:80;
    server_name poetry.70kj.vip;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # nginx 1.24 及以下: http2 挂在 listen; 1.25+ 可写 `http2 on;`
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name poetry.70kj.vip;

    ssl_certificate     /etc/letsencrypt/live/poetry.70kj.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poetry.70kj.vip/privkey.pem;

    # 反代到本机 1279 (容器)
    location / {
        proxy_pass http://127.0.0.1:1279;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/poetry.access.log;
}
